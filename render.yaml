# Render Blueprint — New > Blueprint in the Render dashboard, then pick this repo.
services:
  - type: web
    name: bloggraph
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:api --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      # No AI keys here: every user brings their own Google Gemini / Hugging Face key in the app.
      # Keep ALLOW_SERVER_KEYS at 0 so requests can never fall back to a server-side key.
      - key: ALLOW_SERVER_KEYS
        value: "0"
      - key: GEMINI_MODEL
        value: "gemini-flash-latest"
      # PostgreSQL URL — REQUIRED on Render (SQLite is wiped on every restart)
      # Create a free PostgreSQL database on render.com and paste its Internal URL here
      - key: DATABASE_URL
        sync: false
      # LangSmith tracing (optional but recommended)
      - key: LANGCHAIN_TRACING_V2
        value: "true"
      - key: LANGCHAIN_ENDPOINT
        value: "https://api.smith.langchain.com"
      - key: LANGCHAIN_API_KEY
        sync: false
      - key: LANGCHAIN_PROJECT
        value: "bloggraph-prod"
      # App settings
      # Successful blogs per account per 24 h (0 = unlimited; users spend their own Gemini quota)
      - key: DAILY_GENERATION_LIMIT
        value: "0"
      - key: ENABLE_IMAGES
        value: "1"
